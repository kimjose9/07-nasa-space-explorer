<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div>
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <section class="fact" aria-labelledby="factTitle">
      <p class="fact-label" id="factTitle">Did you know?</p>
      <p id="spaceFact" aria-live="polite"></p>
    </section>

    <form class="filters" id="dateForm">
      <label>
        <span>From</span>
        <input type="date" id="startDate" required />
      </label>
      <label>
        <span>To</span>
        <input type="date" id="endDate" required />
      </label>
      <button type="submit" id="loadImages">Get Space Images</button>
    </form>

    <div id="gallery" class="gallery" aria-live="polite" aria-busy="false">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog class="image-modal" id="imageModal" aria-labelledby="modalTitle">
    <button class="modal-close" id="closeModal" type="button" aria-label="Close image details">&times;</button>
    <img class="modal-image" id="modalImage" alt="" />
    <div class="modal-copy">
      <p class="modal-date" id="modalDate"></p>
      <h2 id="modalTitle"></h2>
      <p class="modal-explanation" id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
