<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div class="brand-copy">
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
      <p class="header-note">A DAILY VIEW OF THE UNIVERSE<br /><span>NASA ARCHIVE / 1995—TODAY</span></p>
    </div>
  </header>

  <main class="container">
    <section class="explore-toolbar" aria-label="Explore the APOD archive">
      <section class="fact" aria-labelledby="factTitle">
        <p class="fact-label" id="factTitle"><span class="fact-marker">01</span> Did you know?</p>
        <p id="spaceFact" aria-live="polite"></p>
      </section>

      <form class="filters" id="dateForm">
        <div class="filters-heading">
          <p class="section-kicker">Choose a date range</p>
          <h2>Explore the archive</h2>
        </div>
        <label>
          <span>From</span>
          <input type="date" id="startDate" required />
        </label>
        <label>
          <span>To</span>
          <input type="date" id="endDate" required />
        </label>
        <button type="submit" id="loadImages">Get Space Images <span aria-hidden="true">&#8594;</span></button>
      </form>
    </section>

    <section class="gallery-section" aria-labelledby="galleryTitle">
      <div class="gallery-heading">
        <div>
          <p class="section-kicker">NASA / APOD</p>
          <h2 id="galleryTitle">Daily frames</h2>
        </div>
        <p class="gallery-range">JUNE 16, 1995 <span></span> TODAY</p>
      </div>

      <div id="gallery" class="gallery" aria-live="polite" aria-busy="false">
        <div class="placeholder">
          <span class="placeholder-index">01 / READY</span>
          <p>The universe is waiting in the archive.</p>
        </div>
      </div>
    </section>
  </main>

  <dialog class="image-modal" id="imageModal" aria-labelledby="modalTitle">
    <button class="modal-close" id="closeModal" type="button" aria-label="Close image details">&times;</button>
    <img class="modal-image" id="modalImage" alt="" />
    <div class="modal-copy">
      <p class="modal-date" id="modalDate"></p>
      <h2 id="modalTitle"></h2>
      <p class="modal-explanation" id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
